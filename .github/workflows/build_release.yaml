name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  bundle:
    name: Build bundle
    needs: [ test ]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Update version in package.json
        run: npm version "${GITHUB_REF_NAME#v}" --allow-same-version --git-tag-version=false

      - name: Create bundle
        run: scripts/create-bundle.sh

      - name: Upload bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: _releases/psitransfer-${{ github.ref_name }}.tar.gz
          if-no-files-found: error

  docker:
    name: Docker release
    needs: [ test ]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yaml
    secrets:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  npm_publish:
    name: NPM publish
    needs: [ bundle, docker ]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          registry-url: 'https://registry.npmjs.org'

      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle

      - name: NPM deploy
        run: |
          mkdir _pkg
          tar xzf "psitransfer-$GITHUB_REF_NAME.tar.gz" -C _pkg --strip 1
          cd _pkg
          # Keep prereleases (v1.2.3-rc1) off the "latest" dist-tag
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            npm publish --provenance --tag next
          else
            npm publish --provenance
          fi

  release:
    name: GitHub Release
    needs: [ bundle, docker, npm_publish ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Download bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle

      - name: Create Changelog
        id: build_changelog
        uses: mikepenz/release-changelog-builder-action@aa013739bbc8e7067dbbecd4525ff11aeb51a84b # v6.4.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: "COMMIT"
          configurationJson: |
            {
              "template": "#{{CHANGELOG}}",
              "categories": [
                {
                  "title": "## ⚠️ Breaking Changes",
                  "labels": ["breaking"]
                },
                {
                  "title": "## Features",
                  "labels": ["feat"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Performance",
                  "labels": ["perf"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Fixes",
                  "labels": ["fix", "bug"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Maintenance",
                  "labels": ["chore", "refactor", "cleanup"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Build",
                  "labels": ["build"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Documentation",
                  "labels": ["docs"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Tests",
                  "labels": ["test"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Reverts",
                  "labels": ["revert"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Styling",
                  "labels": ["style"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Dependencies",
                  "labels": ["deps"],
                  "exclude_labels": ["breaking"]
                },
                {
                  "title": "## Other Changes",
                  "labels": [],
                  "exclude_labels": ["breaking"]
                }
              ],
              "label_extractor": [
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|bug|perf|cleanup|refactor|revert|style|test|deps){1}(\\([\\w\\-\\.]+\\))?(!):",
                  "on_property": "title",
                  "target": "breaking"
                },
                {
                  "pattern": "^(build|chore|ci|docs|feat|fix|bug|perf|cleanup|refactor|revert|style|test|deps){1}(\\([\\w\\-\\.]+\\))?(!)?: ([\\w ])+([\\s\\S]*)",
                  "on_property": "title",
                  "target": "$1"
                }
              ],
              "transformers": [
                {
                  "pattern": "(^- \\[\\w+)\\([^)]*\\)(:)",
                  "target": "$1$2"
                }
              ],
              "pr_template": "- [#{{TITLE}}](https://github.com/${{ github.repository }}/commit/#{{MERGE_SHA}}) by @#{{AUTHOR}}"
            }

      - name: Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: ${{ steps.build_changelog.outputs.changelog }}
          fail_on_unmatched_files: true
          files: psitransfer-${{ github.ref_name }}.tar.gz
