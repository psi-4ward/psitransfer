version: 2

updates:
  # Keeps the SHA-pinned actions current
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # Wait before proposing a fresh release, so compromised versions are
    # usually yanked before they reach us
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  # Security updates only (needs "Dependabot security updates" enabled in the
  # repo settings), runtime dependencies only
  - package-ecosystem: npm
    directories:
      - /
      - /app
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    allow:
      - dependency-type: production
    commit-message:
      prefix: deps
    groups:
      security:
        applies-to: security-updates
        patterns:
          - "*"
