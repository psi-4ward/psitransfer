version: 2

# cooldown: wait a few days before proposing a fresh release, so compromised
# versions are usually yanked before they reach us
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: npm
    directories:
      - /
      - /app
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 14
    commit-message:
      prefix: deps
    # Bundle minor/patch updates, majors come as separate PRs
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
